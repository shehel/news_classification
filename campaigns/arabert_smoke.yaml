campaign_id: arabert_smoke
description: Smoke test of AraBERT multi-task model on seneca1 queue.
project: news_google_challenge
workdir: .
seed_arg: seed
queues: [seneca1]

hypothesis: >
  Verifies that clearml-agent on seneca1 can resolve the dataset, instantiate the AraBERT
  encoder, execute forward and backward passes with mixed precision, and log metrics.

base_task:
  script: scripts/train.py
  tags: [template:train_arabert]
  fixed_args:
    model: arabert
    epochs: 1
    batch_size: 16
    max_length: 128
    fp16: true
    folds_file: folds.csv

grid:
  - name: smoke_fold0
    args: {fold: 0}

seeds: [42]

eval:
  script: scripts/eval.py
  tags: [template:eval_arabert]
  checkpoint_arg: checkpoint_task_id
  fixed_args:
    test_file: Test.csv
    folds_file: folds.csv
    max_length: 128
