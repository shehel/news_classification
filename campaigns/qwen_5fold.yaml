campaign_id: exp3_qwen_5fold
description: 5-Fold cross validation of Qwen3.5-9B multi-task LoRA classifier on seneca1.
project: news_google_challenge
workdir: .
seed_arg: seed
queues: [seneca1]

hypothesis: >
  Qwen3.5-9B with parameter-efficient LoRA leverages rich world knowledge and contextual
  geopolitical reasoning, providing exceptional discriminatory power on Qatar Related
  and Geography.

base_task:
  script: scripts/train.py
  tags: [template:train_qwen_5fold]
  fixed_args:
    model: qwen
    epochs: 3
    batch_size: 4
    grad_accum: 4
    lr: 1e-4
    max_length: 512
    bf16: true
    gradient_checkpointing: true
    folds_file: folds.csv

grid:
  - name: fold0
    args: {fold: 0}
  - name: fold1
    args: {fold: 1}
  - name: fold2
    args: {fold: 2}
  - name: fold3
    args: {fold: 3}
  - name: fold4
    args: {fold: 4}

seeds: [42]

eval:
  script: scripts/eval.py
  tags: [template:eval_qwen_5fold]
  checkpoint_arg: checkpoint_task_id
  fixed_args:
    test_file: Test.csv
    folds_file: folds.csv
    batch_size: 8
    max_length: 512
